<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 style="justify-content: center; display: flex;"  id="header-title">Registration Form</h1>
        <h2 style="color: red; justify-content: center; display: flex; ">Text box yang berwarna merah wajib diisi</h1>
    </header>
    <section class="form-ini">
        <form class="isi">
            <h3 style="justify-content: center; display: flex;"> Data Diri</h3>
            <div class="aka">
                <label for="name">Nama:</label>
                <input type="Nama" placeholder="Text Input" required class="mandatory">
            </div>
            <div class="aka">
                <label for="email">Email:</label>
                <input type="Email" placeholder="Email Input" required class="mandatory">
            </div>
            <div class="aka">
                <label for="phone-number">Phone Number:</label>
                <input type="phone-number" placeholder="Text Input" required class="mandatory">            
            </div>
            <div class="aka">
                <label>Gender:</label>
                <input type="radio" name="gender" required> Male
                <input type="radio" name="gender" required> Female                                        
            </div>
            <div class="aka">                
                <label>Hobbies:</label> 
                <input type="checkbox" name="hobby"> GYM
                <input type="checkbox" name="hobby"> Coding
                <input type="checkbox" name="hobby"> Music
                <input type="checkbox" name="hobby"> Traveling
            </div>
            <div class="aka">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" required class="mandatory">
            </div>
            <label for="program">Program of Study:</label>
            <div class="aka">
            <select style="font-size: 13px; font-family: 'Times New Roman', Times, serif;" id="program" required class="mandatory-1">
                <option value="">Select Program</option>
                <option value="accounting">Accounting</option>
                <option value="finance">Finance</option>
                <option value="information-systems">Information Systems</option>
                <option value="computer-science">Computer Science</option>
                <option value="management">Management</option>
            </select>
            </div>
            <label for="address">Full Address:</label>
            <div class="aka">
            <textarea id="address" placeholder="Enter your address" required class="mandatory"></textarea>
            </div>
            <button type="submit" class="submit"> Submit </button>

        </form>
    </section>
</body>
</html>
