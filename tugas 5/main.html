<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Registration Form</h2>
        <form id="registrationForm" onsubmit="return validateForm()">
            <label>Full Name</label>
            <input type="text" id="fullname" placeholder="Enter your full name">
            <span class="error" id="errorFullname"></span>

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email">
            <span class="error" id="errorEmail"></span>

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
            <span class="error" id="errorPassword"></span>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password">
            <span class="error" id="errorConfirmPassword"></span>

            <label>Phone Number</label>
            <input type="text" id="phone" placeholder="Enter phone number">
            <span class="error" id="errorPhone"></span>

            <label>Gender</label>
            <div class="gender-group">
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
            </div>
            <span class="error" id="errorGender"></span>

            <label>Hobbies / Interests</label>
            <div class="hobbies-group">
                <label><input type="checkbox" name="hobbies" value="Reading"> Reading</label>
                <label><input type="checkbox" name="hobbies" value="Gaming"> Gaming</label>
                <label><input type="checkbox" name="hobbies" value="Music"> Music</label>
            </div>
            <span class="error" id="errorHobbies"></span>

            <label>Country</label>
            <select id="country">
                <option value="">Select Country</option>
                <option value="Indonesia">Indonesia</option>
                <option value="Malaysia">Malaysia</option>
                <option value="Singapore">Singapore</option>
            </select>
            <span class="error" id="errorCountry"></span>

            <button type="submit">Submit</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
